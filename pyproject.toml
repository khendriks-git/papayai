[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "papayai"
version = "0.1.0"
description = "AI assistant CLI with multi-provider support"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
papayai = "papayai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["papayai*"]
